<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eden Garden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #a78bfa;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8b5cf6;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #4c1d95;
      }

      /* Character Animations - Slower, deeper breathing for 3D effect */
      @keyframes breathe {
        0%, 100% { transform: scale(1) translateY(0); }
        50% { transform: scale(1.02) translateY(-6px); }
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
        20%, 40%, 60%, 80% { transform: translateX(4px); }
      }
      @keyframes bounce-subtle {
         0%, 100% { transform: translateY(0); }
         50% { transform: translateY(-10px); }
      }
      .animate-breathe {
        animation: breathe 6s ease-in-out infinite;
      }
      .animate-shake {
        animation: shake 0.5s ease-in-out infinite;
      }
      .animate-bounce-subtle {
        animation: bounce-subtle 2s ease-in-out infinite;
      }

      /* Background Animations */
      @keyframes pan-zoom {
        0% { transform: scale(1.1) translate(0, 0); }
        25% { transform: scale(1.15) translate(-1%, -1%); }
        50% { transform: scale(1.1) translate(-2%, 0); }
        75% { transform: scale(1.15) translate(-1%, 1%); }
        100% { transform: scale(1.1) translate(0, 0); }
      }
      .animate-pan-zoom {
        animation: pan-zoom 40s ease-in-out infinite;
        will-change: transform;
      }

      /* Screen Effects */
      @keyframes shake-screen {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-5px, -5px) rotate(-1deg); }
        20% { transform: translate(5px, 5px) rotate(1deg); }
        30% { transform: translate(-5px, 5px); }
        40% { transform: translate(5px, -5px); }
        50% { transform: translate(-3px, 3px); }
        60% { transform: translate(3px, -3px); }
        70% { transform: translate(0, 2px); }
        80% { transform: translate(-1px, 0); }
      }
      .animate-shake-screen {
        animation: shake-screen 0.5s cubic-bezier(.36,.07,.19,.97) both;
      }

      @keyframes flash-screen {
        0% { background-color: rgba(255,255,255,0); }
        10% { background-color: rgba(255,255,255,0.9); }
        100% { background-color: rgba(255,255,255,0); }
      }
      .animate-flash-screen {
        animation: flash-screen 0.8s ease-out forwards;
      }

      /* Choice Glows */
      .glow-wealth {
        box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
        animation: pulse-gold 2s infinite;
      }
      @keyframes pulse-gold {
        0%, 100% { box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); border-color: rgba(251, 191, 36, 0.6); }
        50% { box-shadow: 0 0 25px rgba(251, 191, 36, 0.7); border-color: rgba(251, 191, 36, 1); }
      }
      
      /* Glossy Button Effect */
      .glossy-button {
        background: linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 51%, rgba(0,0,0,0.2) 100%);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
</head>
  <body class="bg-gray-900 text-gray-100 overflow-hidden">
    <div id="root"></div>
  </body>
</html>
