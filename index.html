<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eden Garden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #a78bfa;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8b5cf6;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #4c1d95;
      }

      /* --- Character Animations: Nuanced Idle States --- */
      
      /* Standard Idle: Gentle breathing + subtle rotation */
      @keyframes idle-standard {
        0% { transform: scale(1) translateY(0) rotate(0deg); }
        33% { transform: scale(1.002) translateY(-2px) rotate(0.2deg); }
        66% { transform: scale(1.005) translateY(-3px) rotate(-0.2deg); }
        100% { transform: scale(1) translateY(0) rotate(0deg); }
      }

      /* Angry/Tense: Faster, sharper movements, slight jitter */
      @keyframes idle-angry {
        0% { transform: scale(1) translateY(0); filter: contrast(1); }
        50% { transform: scale(1.03) translateY(2px); filter: contrast(1.1); }
        52% { transform: scale(1.03) translateY(2px) translateX(1px); }
        54% { transform: scale(1.03) translateY(2px) translateX(-1px); }
        100% { transform: scale(1) translateY(0); filter: contrast(1); }
      }

      /* Happy/Excited: Bouncy and light */
      @keyframes idle-happy {
        0% { transform: translateY(0); }
        50% { transform: translateY(-8px) scale(1.01); }
        100% { transform: translateY(0); }
      }

      /* Sad: Drooping, slower, slightly dimmed */
      @keyframes idle-sad {
        0% { transform: scaleY(1) translateY(0) brightness(1); }
        50% { transform: scaleY(0.99) translateY(4px) brightness(0.95); }
        100% { transform: scaleY(1) translateY(0) brightness(1); }
      }

      /* Flirty: Sinuous swaying motion */
      @keyframes idle-flirty {
        0% { transform: rotate(0deg) translateY(0); }
        25% { transform: rotate(1deg) translateY(-2px); }
        75% { transform: rotate(-1deg) translateY(-1px); }
        100% { transform: rotate(0deg) translateY(0); }
      }

      /* Shock: Sudden recoil and vibration */
      @keyframes shock-shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-6px) rotate(-1deg); }
        20%, 40%, 60%, 80% { transform: translateX(6px) rotate(1deg); }
      }

      .animate-idle-standard { animation: idle-standard 6s ease-in-out infinite; }
      .animate-idle-angry { animation: idle-angry 4s ease-in-out infinite; }
      .animate-idle-happy { animation: idle-happy 3s ease-in-out infinite; }
      .animate-idle-sad { animation: idle-sad 8s ease-in-out infinite; }
      .animate-idle-flirty { animation: idle-flirty 5s ease-in-out infinite; }
      .animate-shock { animation: shock-shake 0.5s ease-in-out; }

      /* Background Animations */
      @keyframes pan-zoom {
        0% { transform: scale(1.1) translate(0, 0); }
        25% { transform: scale(1.15) translate(-1%, -1%); }
        50% { transform: scale(1.1) translate(-2%, 0); }
        75% { transform: scale(1.15) translate(-1%, 1%); }
        100% { transform: scale(1.1) translate(0, 0); }
      }
      .animate-pan-zoom {
        animation: pan-zoom 40s ease-in-out infinite;
        will-change: transform;
      }

      /* Screen Effects */
      @keyframes shake-screen {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-5px, -5px) rotate(-1deg); }
        20% { transform: translate(5px, 5px) rotate(1deg); }
        30% { transform: translate(-5px, 5px); }
        40% { transform: translate(5px, -5px); }
        50% { transform: translate(-3px, 3px); }
        60% { transform: translate(3px, -3px); }
        70% { transform: translate(0, 2px); }
        80% { transform: translate(-1px, 0); }
      }
      .animate-shake-screen {
        animation: shake-screen 0.5s cubic-bezier(.36,.07,.19,.97) both;
      }

      @keyframes flash-screen {
        0% { background-color: rgba(255,255,255,0); }
        10% { background-color: rgba(255,255,255,0.9); }
        100% { background-color: rgba(255,255,255,0); }
      }
      .animate-flash-screen {
        animation: flash-screen 0.8s ease-out forwards;
      }

      /* Choice Glows */
      .glow-wealth {
        box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
        animation: pulse-gold 2s infinite;
      }
      @keyframes pulse-gold {
        0%, 100% { box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); border-color: rgba(251, 191, 36, 0.6); }
        50% { box-shadow: 0 0 25px rgba(251, 191, 36, 0.7); border-color: rgba(251, 191, 36, 1); }
      }
      
      /* Glossy Button Effect */
      .glossy-button {
        background: linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 51%, rgba(0,0,0,0.2) 100%);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
</head>
  <body class="bg-gray-900 text-gray-100 overflow-hidden">
    <div id="root"></div>
  </body>
</html>
